name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Cheap checks first: if a guard fails there is no point burning five build
  # slots. These are the same scripts contributors run locally.
  guards:
    name: consistency guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: i18n — firmware table and web locales
        run: python3 scripts/check-i18n.py

      - name: CODEMAP — function line numbers have not drifted
        run: |
          bash scripts/check-codemap.sh || {
            echo "::error::CODEMAP.md has drifted. Fix with: python3 scripts/sync-codemap.py"
            exit 1
          }

      - name: TOC — regenerating it produces no diff
        run: |
          bash scripts/update_toc.sh
          if ! git diff --quiet; then
            echo "::error::The in-file table of contents is out of date."
            echo "Run 'bash scripts/update_toc.sh' and commit the result."
            git --no-pager diff
            exit 1
          fi

      - name: No mojibake in source, data or scripts
        run: bash scripts/check-mojibake.sh


      - name: No emoji in documentation
        run: python3 scripts/check-emoji.py


  # Does this commit actually touch the firmware? Most do not — this repository
  # gets a lot of documentation and installer-page commits, and compiling five
  # environments to prove a README typo still builds is six wasted minutes every
  # time. The guards above always run; only the matrix below is conditional.
  scope:
    name: does this touch the firmware
    runs-on: ubuntu-latest
    outputs:
      firmware: ${{ steps.check.outputs.firmware }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Compare against the PR base, the previous push, or — for a first push
          # or a force-push whose old head is gone — just build.
          FROM="${BASE:-$BEFORE}"
          if [ -z "$FROM" ] || [ "$FROM" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$FROM^{commit}" 2>/dev/null; then
            echo "No usable base to diff against — building everything."
            echo "firmware=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only "$FROM" "${{ github.sha }}")
          echo "Changed files:"; echo "$CHANGED" | sed 's/^/  /'

          # Anything that can change a compiled artifact. `data/` is in here
          # because it becomes the LittleFS image the release publishes.
          if echo "$CHANGED" | grep -qE '^(TigerTagSplashESP32/|include/|lib/|data/|platformio\.ini|partitions\.csv|\.github/workflows/build\.yml)'; then
            echo "firmware=true" >> "$GITHUB_OUTPUT"
            echo "-> firmware touched, building all five environments"
          else
            echo "firmware=false" >> "$GITHUB_OUTPUT"
            echo "-> documentation or web installer only, skipping the build matrix"
          fi

  build:
    name: ${{ matrix.env }}
    needs: [guards, scope]
    if: needs.scope.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env:
          - esp32s3_hsu_b      # -3.5B, published, bench-verified
          - esp32s3_hsu        # -3.5,  published
          - esp32s3            # SPI, not published
          - esp32s3_i2c        # I2C on Wire1, not published
          - esp32s3_hsu_debug  # + PN532DEBUG
          - esp32s3_i2c_debug  # + PN532DEBUG
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Build
        run: pio run -e ${{ matrix.env }}

      - name: Report firmware size
        run: |
          BIN=".pio/build/${{ matrix.env }}/firmware.bin"
          SIZE=$(wc -c < "$BIN")
          echo "### ${{ matrix.env }}" >> "$GITHUB_STEP_SUMMARY"
          echo "firmware.bin: $SIZE bytes ($((SIZE / 1024)) KiB)" >> "$GITHUB_STEP_SUMMARY"
          echo "sha256: $(sha256sum "$BIN" | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: .pio/build/${{ matrix.env }}/firmware.bin
          retention-days: 14
