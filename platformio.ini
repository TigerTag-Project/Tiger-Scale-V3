; ===========================================================================
; TigerScale V3 — ESP32-S3 · 480x320 touch LCD (AXS15231B or ST7796) · PN532
; ===========================================================================
; One firmware, two boards, one wiring. Both the board variant and the PN532
; transport are BUILD-TIME choices, never runtime ones.
;
; PUBLISHED — these two are what the web installer offers and what the OTA
; channel serves. They differ only by the board they target; the wiring, the
; enclosure and the reader transport are the same.
;
;   env                | board                        | transport
;   -------------------|------------------------------|-------------------------
;   esp32s3_hsu_b      | ESP32-S3-Touch-LCD-3.5B      | UART (HSU), 2 readers
;   esp32s3_hsu        | ESP32-S3-Touch-LCD-3.5       | UART (HSU), 2 readers
;
; Pick by the silkscreen on your board, not by guesswork: the two are the same
; size and shape, and flashing the wrong one leaves a black screen — the panel
; controller differs (AXS15231B over QSPI vs ST7796 over SPI).
;
; NOT PUBLISHED — kept building so they cannot rot, but no longer offered to
; users. Every scale in the field is HSU; publishing transports nobody wires
; only offered a choice whose failure mode is silent ("no readers", no reason).
; Build them from source if your wiring needs them.
;
;   env                | transport      | readers | status
;   -------------------|----------------|---------|---------------------------
;   esp32s3            | SPI            | 2       | compiles, not bench-verified
;   esp32s3_i2c        | I2C on Wire1   | 1       | compiles, not bench-verified
;
; Add `-DPN532DEBUG` to any env to trace every byte on the PN532 link
; (esp32s3_hsu_debug / esp32s3_i2c_debug below are ready-made for that).
;
; Wiring per transport: docs/HARDWARE.md
; Flashing:             docs/INSTALLATION.md
; ===========================================================================

[platformio]
src_dir = TigerTagSplashESP32
default_envs = esp32s3_hsu_b

; ---------------------------------------------------------------------------
; Shared settings. [env] is PlatformIO's own "applies to every environment"
; section, so anything added here reaches all of them automatically.
;
; This used to be a [common] section whose keys each env re-listed by hand. That
; silently dropped any newly added key: board_upload.flash_size was declared,
; inherited by nothing, and the build only appeared correct because PlatformIO
; derives the app size from the partition table rather than from flash_size.
; Don't go back to hand-copying.
; ---------------------------------------------------------------------------
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 460800

board_build.filesystem = littlefs
board_build.partitions = partitions.csv
board_build.arduino.memory_type = qio_opi

; The chip carries 16 MB (esptool reports "Detected flash size: 16MB"), but the
; esp32-s3-devkitc-1 board definition assumes 8 MB. Saying so here is what lets
; partitions.csv use the upper half for a second OTA app slot — without it the
; build caps at 8 MB and the table does not fit.
board_upload.flash_size = 16MB
board_build.flash_size = 16MB

lib_deps =
  moononournation/GFX Library for Arduino @ 1.6.5
  tzapu/WiFiManager @ ^2.0.16-rc.2
  mathieucarbou/ESPAsyncWebServer @ ^3.6.0
  mathieucarbou/AsyncTCP @ ^3.3.0
  bogde/HX711 @ ^0.7.5
  adafruit/Adafruit PN532 @ ^1.3.3
  adafruit/Adafruit BusIO @ ^1.16.1
  bblanchon/ArduinoJson @ ^6.21.5
  madhephaestus/ESP32Servo @ ^3.0.5
  lewisxhe/XPowersLib @ ^0.2.6
  lvgl/lvgl @ ^8.3.11

; -DARDUINO_USB_CDC_ON_BOOT=1 is mandatory: without it Serial.println() is
; invisible over the USB-C port and only log_e() reaches the console.
; -I include is what lets LVGL find our lv_conf.h — this is also why the
; project cannot be built from the Arduino IDE (no equivalent include path).
build_flags = ${common.base_flags}

monitor_filters = esp32_exception_decoder

; Referenceable because a per-env `build_flags` REPLACES the inherited value
; instead of extending it, so each transport restates these and adds its own.
[common]
base_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
; Without this the Arduino core never initialises the 8 MB of PSRAM, so
; ESP.getFreePsram() reads 0 and every heap_caps_malloc(MALLOC_CAP_SPIRAM) fails.
; The code already expects it — logMem() is guarded on BOARD_HAS_PSRAM, and the
; LVGL draw buffer asks for SPIRAM first — but each allocation has a silent
; malloc() fallback, so the whole device quietly ran on internal DRAM alone.
; board_build.arduino.memory_type = qio_opi selects the memory layout; this flag
; is what makes the core actually bring it up.
  -DBOARD_HAS_PSRAM
  -D CONFIG_LITTLEFS_FOR_IDF_3_2
  -DESP32QSPI_SPI_HOST=SPI3_HOST
  -D LV_CONF_INCLUDE_SIMPLE
  -I include
  -Os

; ---------------------------------------------------------------------------
; SPI — two readers sharing one SPI bus, each with its own SS + RSTPDN.
; Matches the V2 electrical topology. Compiles clean; not yet bench-verified.
; ---------------------------------------------------------------------------
[env:esp32s3]
; Everything comes from [env]; SPI is the default transport, so no extra flag.

; ---------------------------------------------------------------------------
; HSU (UART) — the reference build. Each module's TXD/RXD wired straight to a
; HardwareSerial port (Serial1 / Serial2), no shared bus. Set both channels of
; the module's mode switch to OFF (Elechouse V3 silkscreen: HSU = OFF/OFF).
;
; Historical trap worth knowing: setupRFID() used to call SPI.begin() on
; GPIO47/48/41 unconditionally, claiming the exact pins this env rebinds to
; Serial1/Serial2 — so nothing was ever transmitted and no reader was ever
; found. That call is now guarded to the SPI transport only.
; ---------------------------------------------------------------------------
[env:esp32s3_hsu_b]
extends = env:esp32s3
build_flags =
  ${common.base_flags}
  -DRFID_TRANSPORT_HSU=1

; ---------------------------------------------------------------------------
; Same HSU wiring, on the ESP32-S3-Touch-LCD-3.5 (no B). One flag covers the
; whole difference — see the TS_BOARD_NONB block in Section 1 of the .ino for
; what it changes and why it is so little: the two boards share a netlist and
; differ on exactly one GPIO.
;
; The env carries no suffix because the board carries none. `esp32s3_hsu_b`
; is the B; this is the plain one. Anything that used to say `esp32s3_hsu`
; and meant the B now says `esp32s3_hsu_b` — chief among them OTA_ENV in
; release.yml and pages.yml, which decides what the whole installed fleet is
; offered.
; ---------------------------------------------------------------------------
[env:esp32s3_hsu]
extends = env:esp32s3
build_flags =
  ${common.base_flags}
  -DRFID_TRANSPORT_HSU=1
  -DTS_BOARD_NONB=1

; ---------------------------------------------------------------------------
; I2C — ONE module on `Wire1` (SDA=GPIO8, SCL=GPIO7). NOT `Wire`/GPIO21-22:
; GPIO22 does not exist on the ESP32-S3 and GPIO21 is wired to the camera
; connector. The PN532's I2C address is fixed at 0x24, so a second module
; on the same bus would collide. A real second I2C reader needs an I2C
; mux (TCA9548A). Set the mode switch to I2C (channel 1 = ON, channel 2 = OFF).
; ---------------------------------------------------------------------------
[env:esp32s3_i2c]
extends = env:esp32s3
build_flags =
  ${common.base_flags}
  -DRFID_TRANSPORT_I2C=1

; ---------------------------------------------------------------------------
; Byte-level PN532 tracing. Same firmware as the env above plus PN532DEBUG,
; which prints every frame sent to and received from the reader — the fastest
; way to tell "my wiring is wrong" apart from "my tag is unreadable".
;
; This used to require a vendored copy of Adafruit_PN532 under debug_lib/ with
; `#define PN532DEBUG` uncommented. It never needed to: the library guards all
; 23 debug sites with #ifdef and defines PN532DEBUGPRINT unconditionally, so a
; plain -D does the same job with no fork to keep in sync with upstream.
; ---------------------------------------------------------------------------
[env:esp32s3_hsu_debug]
extends = env:esp32s3_hsu_b
build_flags =
  ${common.base_flags}
  -DRFID_TRANSPORT_HSU=1
  -DPN532DEBUG

[env:esp32s3_i2c_debug]
extends = env:esp32s3_i2c
build_flags =
  ${common.base_flags}
  -DRFID_TRANSPORT_I2C=1
  -DPN532DEBUG

; ===========================================================================
; REMOVED: env:esp32s3_usbhost — USB-host RFID is a hardware dead end here.
;
; The idea was to drive a USB-C-only PN532 module by making the ESP32-S3 act
; as USB Host. It cannot work on this board, confirmed two independent ways:
; on the bench the diagnostic always read host=OK dev=NONE, and the schematic
; shows connector J5 with fixed 5.1k pull-downs on CC1/CC2 (R24, R26) and no
; VBUS source anywhere in the design — the electrical signature of a USB
; *device*, not a host. Two device-declaring ports never complete USB-C
; attach negotiation. Firmware cannot fix that.
;
; Full postmortem, including what a real fix would take:
; docs/USB_HOST_POSTMORTEM.md — please read it before re-attempting this.
; ===========================================================================
