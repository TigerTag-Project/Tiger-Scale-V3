<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 56" fill="none">
  <!-- Tray (top platform) -->
  <rect x="0" y="0" width="80" height="9" rx="4" fill="white"/>
  <!-- Neck connector between tray and body -->
  <rect x="30" y="9" width="20" height="5" fill="white"/>
  <!-- Main body -->
  <rect x="6" y="14" width="68" height="27" rx="6" fill="white"/>
  <!-- Display window (dark LCD panel) -->
  <rect x="15" y="19" width="50" height="17" rx="3" fill="#1c2030"/>
  <!-- Left foot -->
  <rect x="10" y="41" width="18" height="6" rx="2" fill="white"/>
  <!-- Right foot -->
  <rect x="52" y="41" width="18" height="6" rx="2" fill="white"/>
</svg>
