<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Install TigerScale V3</title>
<meta name="description" content="Flash TigerScale V3 firmware to your ESP32-S3 straight from the browser. No toolchain, no command line.">
<meta property="og:title" content="Install TigerScale V3">
<meta property="og:description" content="Flash the connected filament scale firmware from your browser.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://tigertag-project.github.io/Tiger-Scale-V3/og.png">
<meta property="og:url" content="https://tigertag-project.github.io/Tiger-Scale-V3/">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0a0b0f">
<link rel="canonical" href="https://tigertag-project.github.io/Tiger-Scale-V3/">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "SoftwareApplication",
  "name": "TigerScale V3 firmware",
  "applicationCategory": "DeveloperApplication",
  "operatingSystem": "ESP32-S3",
  "description": "Open-source firmware for a connected 3D-printing filament scale. Reads a TigerTag NFC tag, weighs the spool, subtracts the empty spool weight and reports the net filament remaining.",
  "license": "https://opensource.org/licenses/MIT",
  "url": "https://tigertag-project.github.io/Tiger-Scale-V3/",
  "codeRepository": "https://github.com/TigerTag-Project/Tiger-Scale-V3",
  "programmingLanguage": "C++",
  "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
  "author": { "@type": "Organization", "name": "TigerTag Project", "url": "https://tigersystem.io" }
}
</script>
<link rel="icon" href="favicon.png" type="image/png">
<script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
<script src="i18n.js"></script>

<!-- Resolve the theme before first paint. Left to the stylesheet alone, a visitor
     whose stored choice differs from their OS setting sees the wrong palette flash. -->
<script>
  (function () {
    try {
      var t = localStorage.getItem('tigerscale-theme');
      if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>

<style>
  /* Palette from Tiger Hub's design tokens (lib/tokens.ts) — the brand is orange,
     the ember red is an accent, and the dark ground is a cool near-black. */
  /* Dark is the default, deliberately: it is the brand's own ground and it is what
     the page shows before any preference is known. Light is opt-in through the
     switch, and only then is the choice remembered. */
  :root {
    --brand:#ff7a18; --brand-hover:#e96900; --ember:#e6352b;
    --success:#1aaf6c; --warn:#d29922;

    --bg:#0a0b0f; --bg-alt:#12141b; --panel:#12141b; --panel-hi:#1a1d27;
    --line:#262a36; --fg:#f4f5f8; --muted:#9aa0b0; --faint:#838b9b;
    --link:#ff7a18; --glow:rgba(255,122,24,.20);
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 40px rgba(0,0,0,.45);
    --ring:rgba(255,122,24,.30); --scheme:dark;
  }
  :root[data-theme="light"] {
    --bg:#ffffff; --bg-alt:#f1f3f9; --panel:#ffffff; --panel-hi:#f7f8fc;
    --line:#e3e6ef; --fg:#1c2030; --muted:#6b7287; --faint:#8b91a5;
    /* #ff7a18 on white is 2.6:1 — below AA. Links get a darkened orange instead. */
    --link:#c25400;
    --glow:rgba(255,122,24,.14);
    --shadow:0 1px 2px rgba(28,32,48,.06), 0 8px 28px rgba(28,32,48,.07);
    --ring:rgba(255,122,24,.22);
    --scheme:light;
  }

  * { box-sizing:border-box; }
  html { color-scheme:var(--scheme); }
  body {
    margin:0; padding:0 1.15rem 4rem; background:var(--bg); color:var(--fg);
    font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    transition:background-color .18s ease, color .18s ease;
  }
  a { color:var(--link); text-underline-offset:3px; }
  a:hover { color:var(--brand-hover); }
  .wrap { max-width:1120px; margin:0 auto; }

  /* --- top bar ------------------------------------------------------------ */
  .top {
    display:flex; align-items:center; justify-content:space-between; gap:1rem;
    padding:1.1rem 0 .4rem;
  }
  /* One mark for both themes. The tiger sits on its own dark tile, so it reads
     identically on either ground — swapping in an inverted copy would change the
     logo's colours, which the brand does not do. */
  .top img { height:30px; width:auto; display:block; border-radius:7px; }
  .tools { display:flex; align-items:center; gap:.7rem; }

  /* Language menu. A native <select> cannot be styled below its border on any
     desktop browser — the popup is drawn by the OS — so the list is ours. */
  .langbox { position:relative; }
  .langbtn {
    display:inline-flex; align-items:center; gap:.5rem;
    background:var(--panel); color:var(--fg); border:1px solid var(--line);
    border-radius:999px; padding:.4rem .85rem; font-size:.86rem; font-family:inherit;
    cursor:pointer; line-height:1.2;
    transition:border-color .15s ease, background-color .15s ease;
  }
  .langbtn:hover { border-color:var(--brand); }
  .langbtn .globe { width:15px; height:15px; color:var(--muted); flex:0 0 auto; }
  .langbtn .caret {
    width:0; height:0; flex:0 0 auto; margin-left:.1rem;
    border-left:4px solid transparent; border-right:4px solid transparent;
    border-top:5px solid var(--muted); transition:transform .18s ease;
  }
  .langbox[data-open="1"] .langbtn { border-color:var(--brand); }
  .langbox[data-open="1"] .caret { transform:rotate(180deg); }

  .langmenu {
    position:absolute; top:calc(100% + .5rem); right:0; z-index:40;
    min-width:190px; padding:.35rem; margin:0; list-style:none;
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    box-shadow:var(--shadow);
    opacity:0; transform:translateY(-4px); pointer-events:none;
    transition:opacity .15s ease, transform .15s ease;
  }
  .langbox[data-open="1"] .langmenu { opacity:1; transform:none; pointer-events:auto; }
  .langmenu li {
    display:flex; align-items:center; justify-content:space-between; gap:.75rem;
    padding:.5rem .7rem; border-radius:9px; cursor:pointer; font-size:.88rem;
    color:var(--fg);
  }
  .langmenu li:hover, .langmenu li:focus-visible { background:var(--panel-hi); outline:none; }
  .langmenu li[aria-selected="true"] { color:var(--brand); font-weight:600; }
  .langmenu li .tick { width:14px; height:14px; opacity:0; flex:0 0 auto; }
  .langmenu li[aria-selected="true"] .tick { opacity:1; }

  /* Day/night switch. A real sliding toggle rather than an icon that swaps —
     the position itself says which mode you are in. */
  .switch { display:inline-flex; align-items:center; cursor:pointer; }
  .switch input { position:absolute; opacity:0; width:0; height:0; }
  .track {
    position:relative; width:62px; height:32px; border-radius:999px;
    background:var(--bg-alt); border:1px solid var(--line);
    transition:background-color .2s ease, border-color .2s ease;
  }
  /* The icon rides inside the knob rather than sitting at the ends of the track:
     at the ends the knob covers whichever one is active, which is precisely the
     one the visitor needs to see. */
  .knob {
    position:absolute; top:2px; left:2px; width:26px; height:26px; border-radius:999px;
    background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.28);
    display:grid; place-items:center;
    transition:transform .22s cubic-bezier(.4,0,.2,1), background-color .2s ease;
  }
  .knob .ico { width:14px; height:14px; color:var(--warn); }
  .knob .ico.moon { display:none; }
  .switch input:focus-visible + .track { box-shadow:0 0 0 3px var(--ring); }
  .switch[data-on="dark"] .track { background:var(--panel-hi); border-color:var(--brand); }
  .switch[data-on="dark"] .knob { transform:translateX(30px); background:var(--brand); }
  .switch[data-on="dark"] .knob .ico.sun  { display:none; }
  .switch[data-on="dark"] .knob .ico.moon { display:block; color:#fff; }

  /* --- hero --------------------------------------------------------------- */
  header.hero {
    position:relative; text-align:center; padding:2.6rem 0 2.2rem; overflow:hidden;
  }
  header.hero::before {
    content:""; position:absolute; left:50%; top:-120px; transform:translateX(-50%);
    width:680px; height:460px; pointer-events:none;
    background:radial-gradient(closest-side, var(--glow), transparent 72%);
  }
  header.hero > * { position:relative; }
  .shot { width:min(300px,64vw); height:auto; display:block; margin:0 auto 1.2rem; }
  h1 {
    font-size:clamp(2rem, 5.2vw, 2.9rem); line-height:1.1; margin:0 0 .6rem;
    letter-spacing:-.03em; font-weight:700;
  }
  h1 .accent {
    background:linear-gradient(96deg, var(--brand), var(--ember));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .tagline { color:var(--muted); margin:0 auto; max-width:34rem; font-size:1.03rem; }
  .verpill {
    display:inline-flex; align-items:center; gap:.5rem; margin-top:1.25rem;
    padding:.34rem .8rem .34rem .6rem; border-radius:999px;
    border:1px solid var(--line); background:var(--panel);
    font-size:.82rem; color:var(--muted); box-shadow:var(--shadow);
  }
  /* An author `display` beats the UA stylesheet's [hidden] rule, so the pill would
     show empty until version.json resolves — or for ever if the fetch fails. */
  .verpill[hidden] { display:none; }
  .verpill .dot {
    width:7px; height:7px; border-radius:50%; background:var(--success);
    box-shadow:0 0 0 3px color-mix(in srgb, var(--success) 22%, transparent);
  }
  .verpill b { color:var(--fg); font-weight:600; }

  /* --- two-column layout -------------------------------------------------- */
  .cols { display:grid; grid-template-columns:1fr; gap:1.6rem; align-items:start; }
  @media (min-width:1000px) {
    .cols { grid-template-columns:minmax(0,1fr) 310px; gap:2.2rem; }
    aside.cart { position:sticky; top:1.2rem; }
  }

  /* --- sections ----------------------------------------------------------- */
  .step { display:flex; align-items:center; gap:.7rem; margin:2.2rem 0 .9rem; }
  .step:first-child { margin-top:0; }
  .step .n {
    flex:0 0 auto; width:25px; height:25px; border-radius:999px;
    display:grid; place-items:center; font-size:.8rem; font-weight:700;
    background:var(--brand); color:#fff;
  }
  .step h2 { font-size:1.12rem; margin:0; letter-spacing:-.01em; font-weight:650; }

  .panel {
    background:var(--panel); border:1px solid var(--line); border-radius:20px;
    padding:1.4rem; box-shadow:var(--shadow);
  }
  .lede { margin:0 0 1.1rem; color:var(--muted); font-size:.94rem; }

  /* --- checklist ---------------------------------------------------------- */
  ul.need { margin:0; padding:0; list-style:none; }
  ul.need li {
    position:relative; padding:0 0 .7rem 1.85rem; color:var(--muted); font-size:.94rem;
  }
  ul.need li:last-child { padding-bottom:0; }
  ul.need li::before {
    content:""; position:absolute; left:0; top:.42rem; width:9px; height:5px;
    border-left:2px solid var(--success); border-bottom:2px solid var(--success);
    transform:rotate(-45deg);
  }

  /* --- transport chooser -------------------------------------------------- */
  .choice { display:grid; gap:.7rem; }
  label.opt {
    display:flex; gap:.9rem; align-items:flex-start; padding:1rem 1.1rem;
    border:1px solid var(--line); border-radius:14px; cursor:pointer;
    background:var(--bg-alt);
    transition:border-color .15s ease, background-color .15s ease, box-shadow .15s ease;
  }
  label.opt:hover { border-color:color-mix(in srgb, var(--brand) 55%, var(--line)); }
  label.opt:has(input:checked) {
    border-color:var(--brand); background:var(--panel-hi); box-shadow:0 0 0 3px var(--ring);
  }
  label.opt input { margin-top:.32rem; accent-color:var(--brand); flex:0 0 auto; }
  .opt b { display:block; margin-bottom:.15rem; font-weight:650; }
  .opt small { color:var(--muted); display:block; line-height:1.55; }
  .badge {
    display:inline-block; font-size:.68rem; font-weight:600; letter-spacing:.02em;
    padding:.12rem .5rem; border-radius:999px; border:1px solid var(--line);
    color:var(--muted); margin-left:.45rem; vertical-align:1px; text-transform:uppercase;
  }
  .badge.ok { color:var(--success); border-color:color-mix(in srgb, var(--success) 45%, transparent); }

  /* --- wiring diagram ----------------------------------------------------- */
  details.wiring { margin-top:1.1rem; }
  details.wiring > summary {
    cursor:pointer; list-style:none; display:inline-flex; align-items:center; gap:.5rem;
    font-size:.9rem; font-weight:600; color:var(--link);
  }
  details.wiring > summary::-webkit-details-marker { display:none; }
  details.wiring > summary::before {
    content:""; width:0; height:0; border-left:5px solid currentColor;
    border-top:4px solid transparent; border-bottom:4px solid transparent;
    transition:transform .18s ease;
  }
  details.wiring[open] > summary::before { transform:rotate(90deg); }
  .frame {
    position:relative; width:100%; padding-top:calc(max(56.25%, 400px));
    margin-top:.9rem; border:1px solid var(--line); border-radius:14px;
    overflow:hidden; background:var(--bg-alt);
  }
  .frame iframe { position:absolute; inset:0; width:100%; height:100%; border:none; }
  .credit { margin:.6rem 0 0; font-size:.82rem; color:var(--faint); }

  /* --- install ------------------------------------------------------------ */
  .cta { text-align:center; margin:.3rem 0 .4rem; }
  /* The --esp-tools-button-* variables only style the component's OWN default
     button. The moment you pass a <button slot="activate">, that button is yours
     and arrives completely unstyled — which is why this looked like plain text
     rather than the one thing on the page you are meant to press. */
  esp-web-install-button button[slot="activate"] {
    display:inline-flex; align-items:center; justify-content:center; gap:.6rem;
    padding:1.15rem 2.8rem; font-family:inherit; font-size:1.18rem; font-weight:700;
    letter-spacing:-.01em; color:#fff; cursor:pointer;
    border:none; border-radius:999px;
    background:linear-gradient(96deg, var(--brand), var(--ember));
    box-shadow:0 6px 22px rgba(255,122,24,.34), 0 1px 2px rgba(0,0,0,.3);
    transition:transform .14s ease, box-shadow .18s ease, filter .18s ease;
  }
  esp-web-install-button button[slot="activate"]:hover {
    transform:translateY(-2px); filter:brightness(1.06);
    box-shadow:0 10px 30px rgba(255,122,24,.44), 0 1px 2px rgba(0,0,0,.3);
  }
  esp-web-install-button button[slot="activate"]:active { transform:translateY(0); }
  esp-web-install-button button[slot="activate"]:focus-visible {
    outline:3px solid var(--ring); outline-offset:3px;
  }
  /* A slow pulse on the ring, so the eye lands here first. */
  @media (prefers-reduced-motion: no-preference) {
    esp-web-install-button button[slot="activate"] { animation:ctaPulse 2.8s ease-in-out infinite; }
    @keyframes ctaPulse {
      0%, 100% { box-shadow:0 6px 22px rgba(255,122,24,.34), 0 0 0 0 rgba(255,122,24,.42); }
      55%      { box-shadow:0 6px 22px rgba(255,122,24,.34), 0 0 0 14px rgba(255,122,24,0); }
    }
  }
  .cta small { display:block; margin-top:1rem; color:var(--faint); font-size:.82rem; }

  /* --- callout ------------------------------------------------------------ */
  .note {
    display:flex; gap:.9rem; margin:1.5rem 0 0;
    border:1px solid color-mix(in srgb, var(--warn) 38%, var(--line));
    background:color-mix(in srgb, var(--warn) 7%, var(--panel));
    border-radius:14px; padding:1rem 1.1rem; color:var(--muted); font-size:.93rem;
  }
  .note svg { flex:0 0 auto; width:18px; height:18px; margin-top:.18rem; color:var(--warn); }
  .note b { color:var(--fg); }
  .note p { margin:.35rem 0 0; }

  code {
    background:var(--bg-alt); border:1px solid var(--line); border-radius:6px;
    padding:.1rem .38rem; font-size:.88em;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }

  /* --- after -------------------------------------------------------------- */
  ol.after { margin:0; padding:0; list-style:none; counter-reset:s; }
  ol.after li {
    counter-increment:s; position:relative; padding:0 0 1.05rem 2.1rem;
    color:var(--muted); font-size:.95rem;
  }
  ol.after li:last-child { padding-bottom:0; }
  ol.after li::before {
    content:counter(s); position:absolute; left:0; top:.05rem;
    width:21px; height:21px; border-radius:999px; display:grid; place-items:center;
    font-size:.72rem; font-weight:700; color:var(--muted);
    background:var(--bg-alt); border:1px solid var(--line);
  }
  ol.after b { color:var(--fg); font-weight:600; }

  /* --- shopping list ------------------------------------------------------ */
  aside.cart .panel { padding:1.15rem; }
  .cart h2 {
    font-size:1rem; margin:0 0 .25rem; font-weight:650; letter-spacing:-.01em;
    display:flex; align-items:center; gap:.5rem;
  }
  .cart h2 svg { width:17px; height:17px; color:var(--brand); }
  .cart .lede { font-size:.8rem; margin-bottom:.9rem; line-height:1.5; }
  ul.parts { margin:0; padding:0; list-style:none; }
  ul.parts li {
    display:flex; gap:.6rem; align-items:baseline;
    padding:.6rem 0; border-top:1px solid var(--line); font-size:.87rem;
  }
  ul.parts li:first-child { border-top:none; padding-top:0; }
  ul.parts .q {
    flex:0 0 auto; min-width:1.6rem; font-variant-numeric:tabular-nums;
    color:var(--faint); font-size:.8rem; font-weight:600;
  }
  ul.parts .nm { flex:1 1 auto; }
  ul.parts .nm em { display:block; font-style:normal; color:var(--faint); font-size:.76rem; }
  ul.parts a.buy {
    flex:0 0 auto; font-size:.76rem; font-weight:600; text-decoration:none;
    border:1px solid var(--line); border-radius:999px; padding:.16rem .6rem;
    color:var(--link); transition:border-color .15s ease, background-color .15s ease;
  }
  ul.parts a.buy:hover { border-color:var(--brand); background:var(--panel-hi); }
  .cart .foot { margin:.9rem 0 0; font-size:.78rem; color:var(--faint); line-height:1.55; }
  .cart .foot p { margin:.35rem 0 0; }

  footer {
    text-align:center; margin-top:3rem; padding-top:1.6rem;
    border-top:1px solid var(--line); color:var(--faint); font-size:.88rem;
  }
  footer nav a { margin:0 .55rem; }
  footer p { margin:.5rem 0 0; }

  .unsupported { display:none; margin-top:1.2rem; }
  .no-webserial .unsupported { display:block; }
  .no-webserial .cta { display:none; }

  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
</head>
<body>

<div class="wrap">

<div class="top">
  <a href="https://tigersystem.io" aria-label="TigerTag">
    <img src="tiger-icon.svg" alt="TigerTag" width="30" height="30">
  </a>
  <div class="tools">
    <div class="langbox" id="langbox" data-open="0">
      <button class="langbtn" id="langbtn" type="button" aria-haspopup="listbox"
              aria-expanded="false" data-i18n-aria="lang_label">
        <svg class="globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="9.2"/><path d="M2.8 12h18.4"/>
          <path d="M12 2.8a14 14 0 0 1 0 18.4a14 14 0 0 1 0-18.4z"/>
        </svg>
        <span id="langnow"></span>
        <span class="caret"></span>
      </button>
      <ul class="langmenu" id="langmenu" role="listbox"></ul>
    </div>
    <label class="switch" id="switch" data-on="light">
      <input type="checkbox" id="theme" role="switch" aria-label="Day and night mode" data-i18n-aria="theme_label">
      <span class="track">
        <span class="knob">
          <svg class="ico sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
            <circle cx="12" cy="12" r="4.2"/>
            <path d="M12 2.4v2.2M12 19.4v2.2M4.2 12H2M22 12h-2.2M5.6 5.6 7.2 7.2M16.8 16.8l1.6 1.6M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6"/>
          </svg>
          <svg class="ico moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.5 14.3A8.5 8.5 0 0 1 9.7 3.5a8.5 8.5 0 1 0 10.8 10.8z"/>
          </svg>
        </span>
      </span>
    </label>
  </div>
</div>

<header class="hero">
  <img class="shot" src="tigerscale.png" alt="TigerScale V3" width="760" height="760">
  <h1><span data-i18n="h1_install">Install</span> <span class="accent">TigerScale V3</span></h1>
  <p class="tagline" data-i18n="tagline"></p>
  <div class="verpill" id="verpill" hidden>
    <span class="dot"></span><span><span data-i18n="fw">Firmware</span> <b id="ver"></b></span>
  </div>
</header>

<div class="cols">

<div>

  <div class="step"><span class="n">1</span><h2 data-i18n="need_title"></h2></div>
  <div class="panel">
    <ul class="need">
      <li data-i18n="need_1"></li>
      <li data-i18n="need_2"></li>
      <li data-i18n="need_3"></li>
      <li data-i18n="need_4"></li>
    </ul>
  </div>

  <div class="step"><span class="n">2</span><h2 data-i18n="s1_title"></h2></div>
  <div class="panel">
    <p class="lede" data-i18n="s1_lede"></p>
    <div class="choice">
      <label class="opt">
        <input type="radio" name="env" value="esp32s3_hsu" checked>
        <span>
          <b><span data-i18n="opt_hsu_n"></span><span class="badge ok" data-i18n="badge_reco"></span></b>
          <small data-i18n="opt_hsu_d"></small>
        </span>
      </label>
      <label class="opt">
        <input type="radio" name="env" value="esp32s3">
        <span>
          <b data-i18n="opt_spi_n"></b>
          <small data-i18n="opt_spi_d"></small>
        </span>
      </label>
      <label class="opt">
        <input type="radio" name="env" value="esp32s3_i2c">
        <span>

<script>
  /* ---------- language ---------------------------------------------------- */
  const LANGS = Object.keys(window.I18N);

  // Map what the browser reports onto what we ship. European and Brazilian
  // Portuguese are separate files, so `pt-PT` must not collapse onto `pt`.
  function pickLang() {
    try {
      const saved = localStorage.getItem('tigerscale-lang');
      if (saved && LANGS.includes(saved)) return saved;
    } catch (e) {}
    for (const raw of (navigator.languages || [navigator.language || 'en'])) {
      const tag = raw.toLowerCase();
      if (LANGS.includes(tag)) return tag;
      const base = tag.split('-')[0];
      if (base === 'pt') return tag.startsWith('pt-pt') ? 'pt-pt' : 'pt';
      if (LANGS.includes(base)) return base;
    }
    return 'en';
  }

  function applyLang(code) {
    const t = window.I18N[code] || window.I18N.en;
    document.documentElement.lang = code;
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const v = t[el.dataset.i18n];
      if (v != null) el.textContent = v;
    });
    // Only keys the dictionary itself marks as markup are inserted as HTML.
    document.querySelectorAll('[data-i18n-html]').forEach(el => {
      const v = t[el.dataset.i18nHtml];
      if (v != null) el.innerHTML = v;
    });
    document.querySelectorAll('[data-i18n-aria]').forEach(el => {
      const v = t[el.dataset.i18nAria];
      if (v != null) el.setAttribute('aria-label', v);
    });
    try { localStorage.setItem('tigerscale-lang', code); } catch (e) {}
  }

  const box = document.getElementById('langbox');
  const btn = document.getElementById('langbtn');
  const menu = document.getElementById('langmenu');
  const now = document.getElementById('langnow');

  const TICK = '<svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" '
             + 'stroke-width="3" stroke-linecap="round" stroke-linejoin="round">'
             + '<path d="M4.5 12.5 9.5 17.5 19.5 6.5"/></svg>';

  menu.innerHTML = LANGS.map(c =>
    `<li role="option" tabindex="0" data-code="${c}" aria-selected="false">`
    + `<span>${window.I18N[c].lang_name}</span>${TICK}</li>`).join('');

  function setOpen(open) {
    box.dataset.open = open ? '1' : '0';
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
  function choose(code) {
    applyLang(code);
    now.textContent = window.I18N[code].lang_name;
    menu.querySelectorAll('li').forEach(li =>
      li.setAttribute('aria-selected', li.dataset.code === code ? 'true' : 'false'));
    setOpen(false);
  }

  btn.addEventListener('click', () => setOpen(box.dataset.open !== '1'));
  menu.addEventListener('click', e => {
    const li = e.target.closest('li');
    if (li) choose(li.dataset.code);
  });
  menu.addEventListener('keydown', e => {
    const li = e.target.closest('li');
    if (!li) return;
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); choose(li.dataset.code); }
  });
  document.addEventListener('click', e => {
    if (!box.contains(e.target)) setOpen(false);
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { setOpen(false); btn.focus(); }
  });

  choose(pickLang());

  /* ---------- day / night ------------------------------------------------- */
  const root = document.documentElement;
  const themeBox = document.getElementById('theme');
  const sw = document.getElementById('switch');

  function isDark() {
    return root.getAttribute('data-theme') !== 'light';
  }
  function paintSwitch() {
    const dark = isDark();
    themeBox.checked = dark;
    sw.dataset.on = dark ? 'dark' : 'light';
  }
  paintSwitch();
  themeBox.addEventListener('change', () => {
    const next = themeBox.checked ? 'dark' : 'light';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('tigerscale-theme', next); } catch (e) {}
    paintSwitch();
  });


  /* ---------- installer --------------------------------------------------- */
  const installer = document.getElementById('installer');
  document.querySelectorAll('input[name=env]').forEach(r => {
    r.addEventListener('change', () => {
      installer.manifest = `manifest-${r.value}.json`;
    });
  });

  // Web Serial is Chromium-only; say so plainly rather than showing a dead button.
  if (!('serial' in navigator)) document.body.classList.add('no-webserial');

  // Show which version this page installs, read from the same manifest the
  // device's own over-the-air check uses — so the two cannot disagree.
  fetch('version.json')
    .then(r => r.ok ? r.json() : null)
    .then(v => {
      if (v && v.version) {
        document.getElementById('ver').textContent = v.version;
        document.getElementById('verpill').hidden = false;
      }
    })
    .catch(() => {});
</script>
